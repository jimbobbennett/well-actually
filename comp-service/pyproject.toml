[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "speech-coach"
version = "0.1.0"
description = "Timescale speech-turn coaching worker with opt-in Pavlok vibration"
requires-python = ">=3.11"
dependencies = ["openai>=1.68,<3", "psycopg[binary]>=3.2,<4", "httpx>=0.27,<1", "python-dotenv>=1,<2", "arize-otel", "openinference-instrumentation-openai"]

[project.scripts]
speech-coach = "speech_coach.worker:main"

[tool.setuptools.packages.find]
where = ["src"]
